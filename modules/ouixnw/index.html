<section class="modulex-oz3" id="oz3-{{id}}">
  <div class="modulex-oz3-wrap">
    <div class="modulex-oz3-yan">{{oz3head}}</div>
    <ol class="modulex-oz3-list" aria-label="{{listLabel}}">{{oz3list}}</ol>
  </div>
</section>

<style>
  /* Numaralı Özellik Listesi (ozellik-zigzag-3). Renkler yalnız desing token'ı. */
  .modulex-oz3 {
    box-sizing: border-box; width: 100%;
    padding-block: clamp(40px, 7vw, 96px); padding-inline: clamp(16px, 4vw, 32px);
    background: --bgcolor--; color: --textcolor--;
  }
  .modulex-oz3 *, .modulex-oz3 *::before, .modulex-oz3 *::after { box-sizing: border-box; }
  .modulex-oz3 :where(span:not(.material-symbols-outlined), bdi, b, strong, em) { font: inherit; }
  .modulex-oz3-wrap {
    max-width: --max--; margin-inline: auto;
    display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(32px, 6vw, 96px); align-items: start;
  }
  .modulex-oz3-yan { position: sticky; top: 96px; }
  .modulex-oz3-eyebrow { margin: 0 0 12px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: --accent--; }
  .modulex-oz3-title { margin: 0 0 14px; font-size: clamp(1.8rem, 1.2rem + 2vw, 2.8rem); line-height: 1.12; color: --textcolor--; text-wrap: balance; }
  .modulex-oz3-desc { margin: 0 0 24px; font-size: 1.05rem; line-height: 1.75; color: --mutedcolor--; }
  .modulex-oz3 a.modulex-oz3-cta, .modulex-oz3 a.modulex-oz3-cta:visited {
    display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; margin-bottom: 28px;
    border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none;
  }
  .modulex-oz3 a.modulex-oz3-cta:focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-oz3-img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; border-radius: --radius--; background: --surface2--; }

  .modulex-oz3-list { list-style: none; margin: 0; padding: 0; counter-reset: none; }
  .modulex-oz3-item {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(16px, 3vw, 36px); align-items: baseline;
    padding-block: clamp(22px, 3vw, 34px); border-top: 1px solid --bordercolor--;
  }
  .modulex-oz3-item:last-child { border-bottom: 1px solid --bordercolor--; }
  .modulex-oz3-no {
    min-width: 2ch; font-size: clamp(2rem, 1.4rem + 2vw, 3.2rem); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; color: --accent--;
  }
  .modulex-oz3-h { margin: 0 0 8px; font-size: clamp(1.15rem, 1rem + 0.6vw, 1.45rem); line-height: 1.3; color: --textcolor--; }
  .modulex-oz3-p { margin: 0; line-height: 1.75; color: --mutedcolor--; }

  @media (max-width: 900px) {
    .modulex-oz3-wrap { grid-template-columns: 1fr; }
    .modulex-oz3-yan { position: static; }
    [class*="modulex"] { max-width: 100%; box-sizing: border-box; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-oz3 *, .modulex-oz3 *::before, .modulex-oz3 *::after { animation: none !important; transition: none !important; }
  }
</style>

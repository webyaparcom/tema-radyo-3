<style>
  /* kayan-serit-goz — Tek kare değil, bir sonraki içerik göz ucuyla görünür (peek); slaytlar kart olarak kayar (RTL'de ters yöne), metin kart zemininde. */
  .modulex-kayan-serit-goz { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-kayan-serit-goz *, .modulex-kayan-serit-goz *::before, .modulex-kayan-serit-goz *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-kayan-serit-goz :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-kayan-serit-goz :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-kayan-serit-goz :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-kayan-serit-goz :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-kayan-serit-goz img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-kayan-serit-goz) img { height: auto; }
  .modulex-kayan-serit-goz [hidden] { display: none !important; }
  .modulex-kayan-serit-goz :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-kayan-serit-goz :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-kayan-serit-goz-ic { max-width: --max--; margin-inline: auto; }
  .modulex-kayan-serit-goz-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-kayan-serit-goz--bassiz .modulex-kayan-serit-goz-bas { display: none; }
  .modulex-kayan-serit-goz-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-kayan-serit-goz-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-kayan-serit-goz-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-kayan-serit-goz-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-kayan-serit-goz-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-kayan-serit-goz-dugme:hover { transform: translateY(-2px); }
  .modulex-kayan-serit-goz-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-kayan-serit-goz-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-kayan-serit-goz-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-kayan-serit-goz { position: relative; }
  /* tam genişlik: taban «.modulex-kayan-serit-goz { padding }» ve 768px «padding-inline: 16px» kuralları sonra gelir → çift sınıfla sıfırla */
  .modulex-kayan-serit-goz.modulex-kayan-serit-goz { padding: 0; }
  .modulex-kayan-serit-goz-karusel { position: relative; outline: none; }
  .modulex-kayan-serit-goz-karusel:focus-visible { outline: 3px solid --accent--; outline-offset: -3px; }
  .modulex-kayan-serit-goz-durum { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .modulex-kayan-serit-goz-sust { color: inherit; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.92; }
  .modulex-kayan-serit-goz-sbaslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.9rem, 4.4vw, 3.6rem); font-weight: 780; letter-spacing: -0.03em; line-height: 1.05; }
  .modulex-kayan-serit-goz-smetin { font-size: clamp(1rem, 1.4vw, 1.15rem); line-height: 1.65; }
  .modulex-kayan-serit-goz-scta { display: inline-flex; align-items: center; gap: 8px; justify-self: start; min-height: 48px; padding: 12px 22px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, box-shadow 0.25s ease; }
  .modulex-kayan-serit-goz-scta:hover { transform: translateY(-2px); box-shadow: 0 14px 26px -16px --accent--; }
  .modulex-kayan-serit-goz-scta .material-symbols-outlined { font-size: 20px; }
  .modulex-kayan-serit-goz-gorsel { width: 100%; height: 100%; object-fit: cover; }
  .modulex-kayan-serit-goz-yer { background: linear-gradient(135deg, color-mix(in srgb, --accent-- 55%, --text--), color-mix(in srgb, --accent-- 20%, --text--)); }
  .modulex-kayan-serit-goz-ok, .modulex-kayan-serit-goz-oynat { display: inline-grid; place-items: center; width: 48px; height: 48px; padding: 0; border: 1px solid --cizgi--; border-radius: 50%; background: --bg--; color: --text--; transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease; }
  .modulex-kayan-serit-goz-ok:hover, .modulex-kayan-serit-goz-oynat:hover { background: --accent--; color: --accentText--; border-color: --accent--; }
  .modulex-kayan-serit-goz-ok:active { transform: scale(0.94); }
  .modulex-kayan-serit-goz-nokta { padding: 0; border: 0; background: transparent; color: inherit; font: inherit; }
  .modulex-kayan-serit-goz-karusel--tek :is(.modulex-kayan-serit-goz-ok, .modulex-kayan-serit-goz-oynat, .modulex-kayan-serit-goz-nokta, .modulex-kayan-serit-goz-denetim, .modulex-kayan-serit-goz-sekmeler, .modulex-kayan-serit-goz-kucukler) { display: none; }

  .modulex-kayan-serit-goz { --gen: min(78%, 980px); --ara: 20px; --yon: -1; }
  :is([dir="rtl"]) .modulex-kayan-serit-goz { --yon: 1; }
  .modulex-kayan-serit-goz-karusel { padding-block: clamp(28px, 4vw, 52px); }
  .modulex-kayan-serit-goz-pencere { overflow: hidden; }
  .modulex-kayan-serit-goz-ray { display: flex; gap: var(--ara); padding-inline: 20px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .modulex-kayan-serit-goz-slayt { flex: none; width: var(--gen); scroll-snap-align: center; transition: transform 0.6s cubic-bezier(0.3, 0.7, 0.2, 1), opacity 0.6s ease; }
  .modulex-kayan-serit-goz--js .modulex-kayan-serit-goz-ray { overflow: visible; padding: 0; transform: translateX(calc(var(--yon) * (var(--i, 0) * (var(--gen) + var(--ara)) - (100% - var(--gen)) / 2))); transition: transform 0.7s cubic-bezier(0.3, 0.7, 0.2, 1); }
  .modulex-kayan-serit-goz--js .modulex-kayan-serit-goz-slayt:not(.modulex-kayan-serit-goz-slayt--aktif) { opacity: 0.45; transform: scale(0.92); }
  .modulex-kayan-serit-goz-kart { display: grid; overflow: hidden; height: 100%; border: 1px solid --cizgi--; border-radius: --yuvarlak--; background: --kartBg--; color: --text--; }
  .modulex-kayan-serit-goz-kart .modulex-kayan-serit-goz-gorsel { height: clamp(220px, calc(var(--kayan-yk) - 260px), 560px); }
  .modulex-kayan-serit-goz-kyazi { display: grid; gap: 12px; align-content: start; padding: clamp(20px, 3vw, 32px); }
  .modulex-kayan-serit-goz-sust { color: --accentInk--; opacity: 1; }
  .modulex-kayan-serit-goz-sbaslik { font-size: clamp(1.5rem, 3vw, 2.4rem); }
  .modulex-kayan-serit-goz-smetin { color: --muted--; }
  .modulex-kayan-serit-goz-denetim { display: flex; align-items: center; justify-content: center; gap: 12px; margin-block-start: 24px; padding-inline: 20px; }
  .modulex-kayan-serit-goz-noktalar { display: flex; gap: 8px; }
  .modulex-kayan-serit-goz-nokta { width: 28px; height: 28px; display: grid; place-items: center; }
  .modulex-kayan-serit-goz-nokta::before { content: ""; width: 10px; height: 10px; border-radius: 999px; background: --cizgi--; transition: width 0.3s ease, background 0.3s ease; }
  .modulex-kayan-serit-goz-nokta--aktif::before { width: 26px; background: --accent--; }
  .modulex-kayan-serit-goz-oynat { margin-inline-start: 8px; }
  @media (max-width: 768px) {
    .modulex-kayan-serit-goz { --gen: 86%; --ara: 12px; }
    .modulex-kayan-serit-goz-ray { padding-inline: 16px; }
    .modulex-kayan-serit-goz-denetim { padding-inline: 16px; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-kayan-serit-goz :is(.modulex-kayan-serit-goz-baslik, .modulex-kayan-serit-goz-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-kayan-serit-goz-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-kayan-serit-goz { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-kayan-serit-goz *, .modulex-kayan-serit-goz *::before, .modulex-kayan-serit-goz *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-kayan-serit-goz";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const kayan = (s, P, az) => {
          const k = s.querySelector("." + P + "-karusel");
          if (!k) return;
          const sl = [...k.querySelectorAll("." + P + "-slayt")];
          const nk = [...k.querySelectorAll("." + P + "-nokta")];
          const oy = k.querySelector("." + P + "-oynat");
          const du = k.querySelector("." + P + "-durum");
          const n = sl.length;
          if (n < 2) return;
          s.classList.add(P + "--js");
          let sure = Number(k.dataset.sure);
          if (!Number.isFinite(sure)) sure = 6000;
          sure = Math.min(20000, Math.max(3000, sure));
          let oto = k.dataset.oto !== "0" && !az;
          let aktif = 0;
          let zam = null;
          let bekle = false;
          const rtl = () => getComputedStyle(k).direction === "rtl";
          const goster = (i, duyur) => {
            i = ((i % n) + n) % n;
            sl.forEach((x, j) => {
              const a = j === i;
              x.classList.toggle(P + "-slayt--aktif", a);
              x.setAttribute("aria-hidden", String(!a));
              x.inert = !a;
            });
            nk.forEach((x, j) => {
              x.classList.toggle(P + "-nokta--aktif", j === i);
              if (j === i) x.setAttribute("aria-current", "true");
              else x.removeAttribute("aria-current");
            });
            k.style.setProperty("--i", String(i));
            aktif = i;
            if (du && duyur) du.textContent = sl[i].getAttribute("aria-label") || "";
          };
          const durdur = () => {
            if (zam) { clearInterval(zam); zam = null; }
            k.classList.remove(P + "--oynuyor");
          };
          const baslat = () => {
            durdur();
            if (!oto || bekle || document.hidden) return;
            void k.offsetWidth;
            k.classList.add(P + "--oynuyor");
            zam = setInterval(() => goster(aktif + 1, false), sure);
          };
          const etiket = () => {
            if (!oy) return;
            oy.setAttribute("aria-label", oto ? (k.dataset.dur || "") : (k.dataset.oyna || ""));
            const ik = oy.querySelector(".material-symbols-outlined");
            if (ik) ik.textContent = oto ? "pause" : "play_arrow";
          };
          const git = (i) => { goster(i, true); baslat(); };
          k.querySelectorAll("[data-kayan]").forEach((b) => b.addEventListener("click", () => git(aktif + (b.dataset.kayan === "geri" ? -1 : 1))));
          nk.forEach((b, j) => b.addEventListener("click", () => git(j)));
          if (oy) oy.addEventListener("click", () => { oto = !oto; etiket(); if (oto) { bekle = false; baslat(); } else durdur(); });
          k.addEventListener("keydown", (e) => {
            const r = rtl();
            if (e.key === "ArrowRight") { e.preventDefault(); git(aktif + (r ? -1 : 1)); }
            else if (e.key === "ArrowLeft") { e.preventDefault(); git(aktif + (r ? 1 : -1)); }
            else if (e.key === "Home") { e.preventDefault(); git(0); }
            else if (e.key === "End") { e.preventDefault(); git(n - 1); }
          });
          k.addEventListener("mouseenter", () => { bekle = true; durdur(); });
          k.addEventListener("mouseleave", () => { bekle = false; baslat(); });
          k.addEventListener("focusin", () => { bekle = true; durdur(); });
          k.addEventListener("focusout", (e) => { if (!k.contains(e.relatedTarget)) { bekle = false; baslat(); } });
          let bx = null;
          k.addEventListener("touchstart", (e) => { bx = e.touches && e.touches[0] ? e.touches[0].clientX : null; }, { passive: true });
          k.addEventListener("touchend", (e) => {
            if (bx === null || !e.changedTouches || !e.changedTouches[0]) return;
            const f = e.changedTouches[0].clientX - bx;
            bx = null;
            if (Math.abs(f) < 40) return;
            git(aktif + ((f < 0) !== rtl() ? 1 : -1));
          }, { passive: true });
          document.addEventListener("visibilitychange", () => { if (document.hidden) durdur(); else baslat(); });
          goster(0, false);
          etiket();
          baslat();
        };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      kayan(s, P, az);
    });
  })();
</script>

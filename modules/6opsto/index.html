<style>
  /* referans-alinti-kart — Logoyu bir cümleyle kanıtlar (referans + görüş); kartlar taş duvar gibi sütunlara akar, ızgara satırına bağlı değil. */
  .modulex-referans-alinti-kart { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-referans-alinti-kart *, .modulex-referans-alinti-kart *::before, .modulex-referans-alinti-kart *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-referans-alinti-kart :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-referans-alinti-kart :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-referans-alinti-kart :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-referans-alinti-kart :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-referans-alinti-kart img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-referans-alinti-kart) img { height: auto; }
  .modulex-referans-alinti-kart [hidden] { display: none !important; }
  .modulex-referans-alinti-kart :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-referans-alinti-kart :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-referans-alinti-kart-ic { max-width: --max--; margin-inline: auto; }
  .modulex-referans-alinti-kart-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-referans-alinti-kart--bassiz .modulex-referans-alinti-kart-bas { display: none; }
  .modulex-referans-alinti-kart-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-referans-alinti-kart-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-referans-alinti-kart-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-referans-alinti-kart-bas { max-width: 760px; }
  .modulex-referans-alinti-kart-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-referans-alinti-kart-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-referans-alinti-kart-dugme:hover { transform: translateY(-2px); }
  .modulex-referans-alinti-kart-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-referans-alinti-kart-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-referans-alinti-kart-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-referans-alinti-kart-akis { columns: 3 260px; column-gap: 18px; }
  .modulex-referans-alinti-kart-kart { break-inside: avoid; margin-block-end: 18px; transition: transform 0.5s ease, opacity 0.5s ease; }
  .modulex-referans-alinti-kart--hazir:not(.modulex-referans-alinti-kart--gor) .modulex-referans-alinti-kart-kart { transform: translateY(18px); }
  .modulex-referans-alinti-kart-kart > *, .modulex-referans-alinti-kart-kart > .modulex-referans-alinti-kart-bag { display: grid; gap: 16px; padding: 24px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-referans-alinti-kart-ust-satir { display: grid; gap: 8px; padding-block-end: 16px; border-block-end: 1px solid --cizgi--; }
  .modulex-referans-alinti-kart-kelime { font-size: 1.25rem; }
  .modulex-referans-alinti-kart-alinti { position: relative; padding-inline-start: 30px; }
  .modulex-referans-alinti-kart-tirnak { position: absolute; inset-block-start: -10px; inset-inline-start: 0; color: --accentInk--; font-size: 3rem; font-weight: 800; line-height: 1; }
  .modulex-referans-alinti-kart-alinti .modulex-referans-alinti-kart-kmetin { color: --text--; font-size: 1rem; }
  .modulex-referans-alinti-kart-kisi { color: --muted--; font-size: 0.88rem; font-weight: 650; }
  .modulex-referans-alinti-kart-kart:hover .modulex-referans-alinti-kart-logo { filter: none; }
  @media (max-width: 768px) { .modulex-referans-alinti-kart-akis { columns: 1; } }
  .modulex-referans-alinti-kart-logo { display: block; width: auto; max-width: 100%; height: clamp(32px, 4vw, 48px); object-fit: contain; filter: grayscale(1); transition: filter 0.3s ease, transform 0.3s ease; }
  .modulex-referans-alinti-kart-kelime { display: inline-block; color: --text--; font-family: var(--mx-font-heading, inherit); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; transition: color 0.3s ease; }
  .modulex-referans-alinti-kart-bag { color: inherit; text-decoration: none; }
  .modulex-referans-alinti-kart-sektor { color: --accentInk--; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .modulex-referans-alinti-kart-kmetin { color: --muted--; font-size: 0.95rem; line-height: 1.65; }
  .modulex-referans-alinti-kart-yil { color: --muted--; font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .modulex-referans-alinti-kart-harf img { width: 100%; height: 100%; object-fit: contain; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-referans-alinti-kart :is(.modulex-referans-alinti-kart-baslik, .modulex-referans-alinti-kart-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-referans-alinti-kart-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-referans-alinti-kart { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-referans-alinti-kart *, .modulex-referans-alinti-kart *::before, .modulex-referans-alinti-kart *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-referans-alinti-kart";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
